name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: test
        run: make test-install

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build image
        run: |
          image=$(printf 'ghcr.io/%s:latest' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          make build ENGINE=docker IMAGE="$image"
      - name: publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          image=$(printf 'ghcr.io/%s:latest' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$image"
