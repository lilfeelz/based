name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: test promotion guards
        run: node --test .github/scripts/image.test.cjs
      - name: test
        run: make test-install

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: build and save image
        shell: bash
        run: |
          image=$(printf 'ghcr.io/%s:latest' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          make build ENGINE=docker IMAGE="$image"
          mkdir -p "$RUNNER_TEMP/image"
          jq -n --arg tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg image "$(docker image inspect --format '{{.Id}}' "$image")" \
            '{tree: $tree, image: $image}' > "$RUNNER_TEMP/image/metadata.json"
          docker save "$image" | gzip -1 > "$RUNNER_TEMP/image/image.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: image-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: locate successful PR build
        id: source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { source } = require('./.github/scripts/image.cjs');
            core.setOutput('run-id', await source(github, context));
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/image/
      - name: verify tested source and image identity
        id: image
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const { verify } = require('./.github/scripts/image.cjs');
            const metadata = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/image/metadata.json`, 'utf8'));
            const tree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding: 'utf8'}).trim();
            core.setOutput('id', verify(metadata, tree));
      - name: publish saved image
        shell: bash
        env:
          IMAGE_ID: ${{ steps.image.outputs.id }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          image=$(printf 'ghcr.io/%s:latest' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker load --input "$RUNNER_TEMP/image/image.tar.gz"
          docker tag "$IMAGE_ID" "$image"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
