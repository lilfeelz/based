name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        run: |
          shellcheck -x -P SCRIPTDIR -s sh \
            bin/w \
            bin/m \
            bin/d \
            bin/k \
            install/pins.sh \
            install/common.sh \
            install/macos.sh \
            install/termux.sh \
            install/container.sh \
            run
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: test pinned install
        run: |
          tmp=$(mktemp -d)
          env -u XDG_DATA_HOME HOME="$tmp/home" \
            BASED_ROOT="$PWD" \
            BASED_BIN="$tmp/home/.local/bin" \
            BASED_DATA="$tmp/home/.local/share/nvim" \
            BASED_NVIM_CONFIG="$tmp/home/.config/nvim" \
            BASED_CONFIG="$tmp/home/.config/based" \
            sh -c '. install/common.sh && install_zmx && install_dvtm && install_nvim && install_pi && install_fzf_lua && install_config'
          test -x "$tmp/home/.local/bin/zmx"
          test -x "$tmp/home/.local/bin/dvtm"
          test -x "$tmp/home/.local/bin/nvim"
          test -x "$tmp/home/.local/bin/pi"
          test -x "$tmp/home/.local/bin/w"
          test -x "$tmp/home/.local/bin/m"
          test -x "$tmp/home/.local/bin/d"
          test -x "$tmp/home/.local/bin/k"
          test -f "$tmp/home/.config/nvim/init.lua"
          test -f "$tmp/home/.config/based/zshrc"
          test -f "$tmp/home/.config/based/keybinds.tsv"
          test -d "$tmp/home/.local/share/nvim/fzf-lua"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: build image
        run: docker build -t ghcr.io/lilfeelz/based:latest -f .devcontainer/Dockerfile .
      - name: publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/lilfeelz/based:latest
